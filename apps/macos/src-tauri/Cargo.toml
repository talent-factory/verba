[package]
name = "verba-macos"
version = "0.0.0"
description = "Verba for macOS — system-wide dictation menu-bar app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "verba_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Microphone capture → WAV (M2). cpal streams are !Send, so capture runs on a
# dedicated thread (see audio.rs).
cpal = "0.15"
hound = "3.5"
# System Keychain for API keys (M2).
keyring = "3"
# Deepgram REST calls (M3): @deepgram/sdk refuses to run in a browser context
# (Tauri's WebView) without a proxy, so the request happens natively here
# instead. See transcribe.rs.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# JS→Rust mid-flight cancellation for the native HTTP commands (TF-521): a
# frontend timeout (withCleanupTimeout / withTranscribeTimeout) aborts the
# in-flight reqwest via a CancellationToken instead of letting it run to its own
# 30s bound and still bill the API for a discarded result. See cancel.rs. tokio
# is already pulled in transitively by reqwest; declared directly here for
# `select!`, `#[tokio::test]`, and the runtime in async tests.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-util = "0.7"
# Paste mechanism (M3): clipboard save/set/restore + synthetic ⌘V keystroke.
# AX value insertion was considered and dropped — see
# docs/superpowers/specs/2026-07-03-macos-paste-cleanup-design.md.
arboard = "3"
core-graphics = "0.25"

# Surface detection (frontmost app + AX window title) for agent-aware templates.
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
accessibility = "0.1"
# core-foundation pinned to 0.9 to match the `accessibility` crate's CFType/CFString.
core-foundation = "0.9"
# core-graphics 0.25 uses core-foundation 0.10 internally; the CGEventTap runloop
# source it hands back is a 0.10 CFRunLoopSource, so the PTT event-tap runloop
# wiring (activation.rs) must use 0.10 CFRunLoop — not the 0.9 above. Renamed to
# avoid clashing with the 0.9 dependency the `accessibility` crate needs.
core-foundation-010 = { package = "core-foundation", version = "0.10" }
