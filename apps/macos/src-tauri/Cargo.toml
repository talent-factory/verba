[package]
name = "verba-macos"
version = "0.0.0"
description = "Verba for macOS — system-wide dictation menu-bar app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "verba_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
