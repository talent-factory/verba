[package]
name = "verba-macos"
version = "0.0.0"
description = "Verba for macOS — system-wide dictation menu-bar app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "verba_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Microphone capture → WAV (M2). cpal streams are !Send, so capture runs on a
# dedicated thread (see audio.rs).
cpal = "0.15"
hound = "3.5"
# System Keychain for API keys (M2).
keyring = "3"
# Deepgram REST calls (M3): @deepgram/sdk refuses to run in a browser context
# (Tauri's WebView) without a proxy, so the request happens natively here
# instead. See transcribe.rs.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
